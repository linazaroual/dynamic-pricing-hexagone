<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Dynamic Pricing – Île-de-France</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    html,body,#map {height:100%;margin:0}
    .legend{
      position:absolute;bottom:12px;left:12px;background:#fff;
      padding:8px 10px;border-radius:10px;
      box-shadow:0 2px 12px rgba(0,0,0,.1);
      font:14px system-ui;
    }
    .dot{
      display:inline-block;width:10px;height:10px;border-radius:50%;
      margin-right:6px;border:1px solid #222;vertical-align:middle;
    }
    .leaflet-popup-content {font:14px system-ui;}
  </style>
</head>
<body>
<div id="map"></div>

<div class="legend">
  <div><span class="dot" style="background:#bfead7"></span> Low (0–1.4x)</div>
  <div><span class="dot" style="background:#ffe499"></span> Medium (1.5–2.4x)</div>
  <div><span class="dot" style="background:#ff9b8c"></span> High (≥2.5x)</div>
</div>

<!-- 🔵 Librairie H3-js -->
<script src="https://unpkg.com/h3-js@3.7.2/dist/h3-js.umd.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

  // -----------------------------
  // 🎯 CARTE
  // -----------------------------
  const map = L.map('map').setView([48.8566, 2.3522], 9);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18
  }).addTo(map);

  // -----------------------------
  // 🎨 COULEURS SURGE
  // -----------------------------
  function surgeColor(v){
    if (v >= 2.5) return '#ff9b8c';
    if (v >= 1.5) return '#ffe499';
    return '#bfead7';
  }

  function styleFromProps(p){
    return {
      weight: 0.4,
      color: '#000000',
      fillOpacity: 0.65,
      fillColor: surgeColor(Number(p.manual_surge))
    };
  }

  // -----------------------------
  // 🔵 CLUSTERING H3 (centre + voisins)
  // -----------------------------
  let hexLayer = null;
  let currentHighlight = [];

  function resetHighlight(){
    currentHighlight.forEach(l => {
      const p = l.feature.properties;
      l.setStyle({
        weight: 0.4,
        color: '#000000',
        fillOpacity: 0.65,
        fillColor: surgeColor(Number(p.manual_surge))
      });
    });
    currentHighlight = [];
  }

  function highlightCluster(centerHex){
    resetHighlight();

    // h3-js — cluster = centre + 6 voisins
    const cluster = h3.gridDisk(centerHex, 1);

    hexLayer.eachLayer(layer => {
      const h = layer.feature.properties.h3_index;
      if (cluster.includes(h)) {
        layer.setStyle({
          fillColor: "#4287f5",
          weight: 2,
          color: "#003d99"
        });
        currentHighlight.push(layer);
      }
    });
  }

  // -----------------------------
  // 🟩 CHARGER HEXAGONES IDF
  // -----------------------------
  fetch("idf_hex_grid_final.json")
    .then(r => r.json())
    .then(gj => {

      hexLayer = L.geoJSON(gj, {
        style: f => styleFromProps(f.properties),

        onEachFeature: (f, poly) => {
          const p = f.properties;

          // Popup info
          poly.bindPopup(`
            <b>${p.id}</b><br>
            Département : <b>${p.city_code}</b><br>
            H3 Index : <code>${p.h3_index}</code><br>
            Latitude : ${p.latitude.toFixed(5)}<br>
            Longitude : ${p.longitude.toFixed(5)}<br>
            UUID : ${p.uuid}<br>
            Disponible : ${p.available}<br>
            Surge : ${p.manual_surge}x<br>
            Statut : ${p.status}
          `);

          // 👉 Highlight cluster au clic
          poly.on("click", () => {
            highlightCluster(p.h3_index);
          });
        }
      }).addTo(map);

      map.fitBounds(hexLayer.getBounds());
    })
    .catch(err => console.error("JSON GRID ERROR:", err));



</script>
</body>
</html>
