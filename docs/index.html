<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Dynamic Pricing – Hexagonal Grids</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body, #map { height: 100%; margin: 0; }

    .legend {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: #fff;
      padding: 8px 10px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,.15);
      font: 14px system-ui;
      z-index: 1000;
    }

    .dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 6px;
      border: 1px solid #222;
      vertical-align: middle;
    }
  </style>
</head>

<body>
<div id="map"></div>

<div class="legend">
  <div><span class="dot" style="background:#e74c3c"></span> Lyon</div>
  <div><span class="dot" style="background:#3498db"></span> Marseille</div>
  <div><span class="dot" style="background:#2ecc71"></span> Toulouse</div>
  <div><span class="dot" style="background:#f39c12"></span> Nice</div>
  <div><span class="dot" style="background:#9b59b6"></span> Lille</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
 
  const map = L.map("map").setView([46.6, 2.5], 6);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18
  }).addTo(map);


  function cityStyle(color) {
    return {
      color: "#000",
      weight: 0.4,
      fillOpacity: 0.45,
      fillColor: color
    };
  }

  
  const cityLayers = [];

  function updateBounds() {
    if (cityLayers.length === 0) return;
    const group = L.featureGroup(cityLayers);
    map.fitBounds(group.getBounds(), { padding: [20, 20] });
  }

  function addCityGrid(url, color) {
    console.log("📦 Loading:", url);

    fetch(url)
      .then(r => {
        if (!r.ok) throw new Error(`${r.status} ${r.statusText}`);
        return r.json();
      })
      .then(gj => {
        console.log("✅ Loaded:", url, "| hexagons:", gj.features?.length);

        const layer = L.geoJSON(gj, {
          style: cityStyle(color)
        }).addTo(map);

        cityLayers.push(layer);
        updateBounds();
      })
      .catch(err => {
        console.error("❌ Error loading:", url, err);
      });
  }


  addCityGrid("docs/lyon_hex_grid.geojson", "#e74c3c");
  addCityGrid("docs/marseille_hex_grid.geojson", "#3498db");
  addCityGrid("docs/toulouse_hex_grid.geojson", "#2ecc71");
  addCityGrid("docs/nice_hex_grid.geojson", "#f39c12");
  addCityGrid("docs/lille_hex_grid.geojson", "#9b59b6");
</script>
</body>
</html>
