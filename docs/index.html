<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Dynamic Pricing – Hexagonal Grids</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    html, body, #map { height: 100%; margin: 0; }

    .legend{
      position:absolute;bottom:12px;left:12px;background:#fff;
      padding:8px 10px;border-radius:10px;
      box-shadow:0 2px 12px rgba(0,0,0,.15);
      font:14px system-ui;z-index:1000;
    }
    .dot{
      display:inline-block;width:10px;height:10px;border-radius:50%;
      margin-right:6px;border:1px solid #222;vertical-align:middle;
    }

    #debug {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 8px 10px;
      border-radius: 10px;
      font: 13px system-ui;
      z-index: 2000;
      max-width: 90%;
      white-space: pre-wrap;
      display: none;
    }
    #debug.error { background: rgba(180, 0, 0, 0.85); display: block; }
    #debug.ok { background: rgba(0, 120, 0, 0.8); display: block; }
  </style>
</head>

<body>
<div id="map"></div>
<div id="debug"></div>

<div class="legend">
  <div><span class="dot" style="background:#111111"></span> Île-de-France</div>
  <div><span class="dot" style="background:#e74c3c"></span> Lyon</div>
  <div><span class="dot" style="background:#3498db"></span> Marseille</div>
  <div><span class="dot" style="background:#2ecc71"></span> Toulouse</div>
  <div><span class="dot" style="background:#f39c12"></span> Nice</div>
  <div><span class="dot" style="background:#9b59b6"></span> Lille</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  const debug = document.getElementById("debug");
  function showError(msg){ debug.className="error"; debug.textContent = "❌ " + msg; }
  function showOk(msg){ debug.className="ok"; debug.textContent = "✅ " + msg; }

  const map = L.map("map").setView([46.6, 2.5], 6);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18 }).addTo(map);

  function makeStyle({ fillColor, fillOpacity=0.45, weight=0.4, color="#000" }){
    return { color, weight, fillOpacity, fillColor };
  }

  const layers = [];
  function updateBounds(){
    if (layers.length === 0) return;
    const group = L.featureGroup(layers);
    map.fitBounds(group.getBounds(), { padding: [20,20] });
  }

  async function addGrid(url, styleObj){
    try{
      const res = await fetch(url, { cache: "no-store" });
      if(!res.ok) throw new Error(`${res.status} ${res.statusText} for ${url}`);

      const gj = await res.json();
      if(!gj || !gj.features || gj.features.length === 0) {
        throw new Error(`Empty GeoJSON: ${url}`);
      }

      const layer = L.geoJSON(gj, { style: () => makeStyle(styleObj) }).addTo(map);
      layers.push(layer);
      updateBounds();

      showOk(`Loaded ${layers.length} file(s).\nLast: ${url} (${gj.features.length} hexagons)`);
      console.log("Loaded:", url, gj.features.length);

    } catch(e){
      console.error(e);
      showError(e.message);
    }
  }

  // ✅ IDF (mets le bon nom ici si besoin)
  // Si ton fichier est un .json GeoJSON, ça marche pareil tant que c’est un FeatureCollection.
  addGrid("./idf_hex_grid_ready.json", { fillColor:"#111111", fillOpacity:0.10, weight:0.25, color:"#111111" });

  // ✅ Cities
  addGrid("./lyon_hex_grid.geojson",      { fillColor:"#e74c3c" });
  addGrid("./marseille_hex_grid.geojson", { fillColor:"#3498db" });
  addGrid("./toulouse_hex_grid.geojson",  { fillColor:"#2ecc71" });
  addGrid("./nice_hex_grid.geojson",      { fillColor:"#f39c12" });
  addGrid("./lille_hex_grid.geojson",     { fillColor:"#9b59b6" });
</script>
</body>
</html>
