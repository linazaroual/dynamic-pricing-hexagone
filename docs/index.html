<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Dynamic Pricing – Hexagonal Zones</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    html, body, #map { height: 100%; margin: 0; }

    .legend {
      position: absolute;
      bottom: 12px;
      left: 12px;
      background: #fff;
      padding: 8px 10px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,.15);
      font: 14px system-ui;
      z-index: 1000;
    }

    .dot {
      display:inline-block;
      width:10px;
      height:10px;
      border-radius:50%;
      margin-right:6px;
      border:1px solid #222;
    }
  </style>
</head>

<body>
<div id="map"></div>

<div class="legend">
  <div><span class="dot" style="background:#555"></span> Île-de-France</div>
  <div><span class="dot" style="background:#e74c3c"></span> Lyon</div>
  <div><span class="dot" style="background:#3498db"></span> Marseille</div>
  <div><span class="dot" style="background:#2ecc71"></span> Toulouse</div>
  <div><span class="dot" style="background:#f39c12"></span> Nice</div>
  <div><span class="dot" style="background:#9b59b6"></span> Lille</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map("map").setView([46.6, 2.5], 6);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 18
}).addTo(map);

function style(color){
  return {
    color: "#000",
    weight: 0.4,
    fillOpacity: 0.55,
    fillColor: color
  };
}

const layers = [];

function addGrid(url, color){
  fetch(url, { cache: "no-store" })
    .then(r => r.json())
    .then(gj => {
      const layer = L.geoJSON(gj, {
        style: style(color),
        onEachFeature: (f, layer) => {
          const p = f.properties || {};
          layer.bindPopup(`
            <b>ID :</b> ${p.id}<br>
            <b>Ville :</b> ${p.city_name || "—"}<br>
            <b>Département :</b> ${p.dept_code || "—"}<br>
            <b>H3 :</b> <code>${p.h3_index}</code><br>
            <b>Surge :</b> ${p.manual_surge}x<br>
            <b>Status :</b> ${p.status}<br>
            <b>Disponible :</b> ${p.available}
          `);
        }
      }).addTo(map);

      layers.push(layer);
      map.fitBounds(L.featureGroup(layers).getBounds(), { padding:[20,20] });
    })
    .catch(e => console.error("Load error:", url, e));
}

/* === DATA (paths corrigés) === */
addGrid("./idf_hex_grid_final.json", "#555");
addGrid("./lyon_hex_grid_final.geojson", "#e74c3c");
addGrid("./marseille_hex_grid_final.geojson", "#3498db");
addGrid("./toulouse_hex_grid_final.geojson", "#2ecc71");
addGrid("./nice_hex_grid_final.geojson", "#f39c12");
addGrid("./lille_hex_grid_final.geojson", "#9b59b6");

</script>
</body>
</html>
